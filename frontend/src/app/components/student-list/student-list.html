<div class="container mt-4">

  @if (students.length > 0) {

    <!-- Export Buttons -->
    <div class="d-flex gap-2 mb-3">
      <button class="btn btn-danger btn-sm" (click)="exportPDF()">Export PDF
      </button>
      <button class="btn btn-success btn-sm" (click)="exportExcel()"> Export Excel
      </button>
    </div>

    <table class="table table-dark table-bordered table-hover">
      <thead>
        <tr>
          <th class="action-cell">id</th>
          <th class="action-cell">First Name</th>
          <th class="action-cell">Last Name</th>
          <th class="action-cell">Age</th>
          <th class="action-cell">Class</th>
          <th class="action-cell">Delete</th>
          <th class="action-cell">Edit</th>
        </tr>
      </thead>
      <tbody>
        @for (student of paginatedStudents; track student.id) {
          <tr>
            <td class="action-cell" class="action-cell">{{ student.id }}</td>
            <td class="action-cell">{{ student.first_name }}</td>
            <td class="action-cell">{{ student.last_name }}</td>
            <td class="action-cell">{{ student.age }}</td>
            <td class="action-cell">{{ student.class }}</td>
            <td class="action-cell">
              <button class="btn btn-danger btn-sm" (click)="deleteStudent(student.id)">
                <i class="bi bi-trash"></i>
              </button>
            </td>
            <td class="action-cell">
              <button class="btn btn-warning btn-sm" (click)="updateStudent(student.id)">
                <i class="bi bi-pencil-square"></i>
              </button>
            </td>
          </tr>
        }
      </tbody>
    </table>

    <div class="d-flex gap-2 mt-4">
      <button class="btn btn-primary" (click)="previousPage()" [disabled]="currentPage === 1">
        Previous
      </button>
      <button class="btn btn-primary" (click)="nextPage()" [disabled]="currentPage * itemsPerPage >= students.length">
        Next
      </button>
    </div>

  } @else {

    <div class="alert alert-danger">
      No Students Found
    </div>

  }
