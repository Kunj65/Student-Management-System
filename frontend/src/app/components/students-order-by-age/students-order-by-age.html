<div class="container mt-4">
  @if (students.length > 0) {
    <table class="table table-dark table-bordered table-hover">
      <thead>
        <tr>
          <th class="action-cell">id</th>
          <th class="action-cell">First Name</th>
          <th class="action-cell">Last Name</th>
          <th class="action-cell">Age</th>
          <th class="action-cell">Class</th>
        </tr>
      </thead>
      <tbody>
        @for (student of paginatedStudents; track student.id) {
          <tr>
            <td class="action-cell">{{ student.id }}</td>
            <td class="action-cell">{{ student.first_name }}</td>
            <td class="action-cell">{{ student.last_name }}</td>
            <td class="action-cell">{{ student.age }}</td>
            <td class="action-cell">{{ student.class }}</td>
          </tr>
        }
      </tbody>
    </table>

    <div class="d-flex gap-2 mt-4">
      <button class="btn btn-primary" (click)="previousPage()" [disabled]="currentPage === 1">
        Previous
      </button>
      <button
        class="btn btn-primary"
        (click)="nextPage()"
        [disabled]="currentPage * itemsPerPage >= students.length"
      >
        Next
      </button>
    </div>
  } @else {
    <div class="alert alert-info">No Students Found</div>
  }
</div>
